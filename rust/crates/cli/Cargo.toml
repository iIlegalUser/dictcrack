[package]
name = "dictcrack"
version = "0.1.0"
edition = "2021"
description = "dictcrack CLI (Rust rewrite)"

[[bin]]
name = "dictcrack"
path = "src/main.rs"

[dependencies]
dictcrack-core = { path = "../core" }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = "1"
