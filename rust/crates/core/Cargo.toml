[package]
name = "dictcrack-core"
version = "0.1.0"
edition = "2021"
description = "dictcrack native archive password-cracking engine (Rust rewrite of the C# core)"

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
ctr = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
